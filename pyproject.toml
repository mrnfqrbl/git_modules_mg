[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-modules-mg"
version = "2.0.0"
description = "Git 仓库批量迁移与子模块管理全局 CLI 工具"
requires-python = ">=3.10"
dependencies = [
    "GitPython>=3.1.40",
    "requests>=2.31",
    "loguru>=0.7",
]

[project.scripts]
gmm = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["lib"]
